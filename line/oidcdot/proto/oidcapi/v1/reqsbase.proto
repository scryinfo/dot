syntax = "proto3";

package oidcapi.v1;

option go_package = "github.com/scryinfo/dot/line/oidcdot/oidc_gen/oidcapi/v1;oidcapiv1";

message Reqbase {
  uint64 req_id_low = 1; //uuid v7
  uint64 req_id_high = 2; //uuid v7
}

message Resbase {
  uint64 req_id_low = 1; //uuid v7
  uint64 req_id_high = 2; //uuid v7
  uint64 res_id_low = 3; //uuid v7
  uint64 res_id_high = 4; //uuid v7
  int32 error_id = 5;
  string message = 6;
}
