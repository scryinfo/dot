[log]
file_name = "log.log"
max_size = 1024000
max_backups = 3
max_age = 7
compress = false
level = "info"
add_stdout_in_debug = false
add_stdout = true
set_slog = true

[connect_server]
auto_run = true
addr = ":8089"
read_timeout = 0
write_timeout = 0
max_concurrent_streams = 100
allowed_origins = []
allow_headers = []
allow_methods = ["GET", "POST", "OPTIONS"]
allow_credentials = true
un_auth_urls = ["*"]
option_methods = true
shutdown_timeout = 1024000
http1 = true
http2 = true
unencrypted_http2 = true
[connect_server.tls]
key = ''
cert = ''
mode = 'none'
peer_cert = ''
root_cert = ''

[oidc_provider]
oidc_issuer = "http://localhost:8090"
client_id = "dajma87ip8rh292hmrk0"
client_secret = "66"
redirect_url = "http://localhost:8089/callback"

[auth_config]
login_path = "/auth2/login"
logout_path = "/auth2/logout"
callback_path = "/auth2/callback"
hash_key = ""
encrypt_key = ""
